<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mythic Character Creator</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Spectral:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="video-bg-placeholder"></div>

    <main class="hero-sheet">
        <div class="glass-overlay"></div>
        
        <div class="content">
            <h1 class="glow-title">LEGEND FORGED</h1>
            
            <div class="main-layout">
                <div class="portrait-frame">
                    <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=Lucky" alt="Hero Portrait" id="heroImg">
                    <div class="frame-border"></div>
                </div>

                <div class="details">
                    <input type="text" placeholder="Name Your Hero..." class="mythic-input">
                    <select class="mythic-select" id="charClass">
                        <option>Dragonborn Paladin</option>
                        <option>Elf Ranger</option>
                        <option>Tiefling Warlock</option>
                        <option>Dwarf Barbarian</option>
                    </select>
                    
                    <button class="fire-btn" onclick="generateStats()">
                        <span>ROLL FOR FATE</span>
                    </button>
                </div>
            </div>

            <div id="statsDisplay" class="stats-container">
                </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
