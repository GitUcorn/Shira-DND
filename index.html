<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mythic Forge</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Uncial+Antiqua&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="main-wrapper">
    <svg class="frame-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
        <path d="M5 5 L95 5 L95 95 L5 95 Z" fill="none" stroke="#c5a059" stroke-width="0.5"/>
        <circle cx="5" cy="5" r="2" fill="#c5a059" />
        <circle cx="95" cy="5" r="2" fill="#c5a059" />
        <circle cx="5" cy="95" r="2" fill="#c5a059" />
        <circle cx="95" cy="95" r="2" fill="#c5a059" />
    </svg>

    <div class="content">
        <header>
            <h1 class="title">MYTHIC FORGE</h1>
            <p class="subtitle">Begin Your Legend</p>
        </header>

        <div class="app-grid">
            <div class="portrait-area">
                <svg viewBox="0 0 100 120" class="hero-svg">
                    <defs>
                        <linearGradient id="grad1" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:#c5a059;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#5d2e0a;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <path d="M50 10 Q60 10 65 25 L70 50 L85 110 L15 110 L30 50 L35 25 Q40 10 50 10" fill="url(#grad1)" />
                    <circle cx="50" cy="30" r="12" fill="url(#grad1)" />
                </svg>
            </div>

            <div class="form-area">
                <input type="text" id="charName" placeholder="NAME YOUR HERO" class="dnd-input">
                <select id="charClass" class="dnd-input">
                    <option>PALADIN</option>
                    <option>WIZARD</option>
                    <option>ROGUE</option>
                    <option>WARRIOR</option>
                </select>

                <button class="roll-trigger" onclick="generateStats()">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M10 0 L19 5 L19 15 L10 20 L1 15 L1 5 Z M10 4 L5 7 L10 10 L15 7 Z" />
                    </svg>
                    ROLL FOR ATTRIBUTES
                </button>
            </div>
        </div>

        <div id="statsGrid" class="stats-grid">
            </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
