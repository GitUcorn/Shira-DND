<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My iPhone SPA</title>
    <style>
        body { font-family: -apple-system, sans-serif; padding: 20px; line-height: 1.6; }
        nav { margin-bottom: 20px; display: flex; gap: 15px; }
        nav a { color: #007AFF; text-decoration: none; font-weight: bold; }
        .page { display: none; }
        .active { display: block; }
        h1 { color: #333; }
    </style>
</head>
<body>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <div id="home" class="page active">
        <h1>Welcome Home</h1>
        <p>This is your local SPA running on your iPhone!</p>
    </div>

    <div id="about" class="page">
        <h1>About Me</h1>
        <p>I built this using only one HTML file.</p>
    </div>

    <div id="contact" class="page">
        <h1>Contact</h1>
        <p>You can find me in the Files app.</p>
    </div>

    <script>
        function navigate() {
            // Get the ID from the URL hash (e.g., "#about")
            const hash = window.location.hash || '#home';
            
            // Hide all pages
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });

            // Show the page that matches the hash
            const activePage = document.querySelector(hash);
            if (activePage) {
                activePage.classList.add('active');
            }
        }

        // Listen for hash changes (when a link is clicked)
        window.addEventListener('hashchange', navigate);

        // Run once on load to show the initial page
        navigate();
    </script>
</body>
</html>
